# limit_req_zone is only valid in the http {} context, but this project's
# nginx.conf is itself included *inside* the base nginx:alpine image's http
# block (via its own default `include conf.d/*.conf`) -- so this file just
# needs to land in conf.d/ alongside default.conf and sort before it
# alphabetically (00- prefix) for the zone to exist by the time default.conf
# references it via `limit_req` below.
#
# This is a coarse, cheap first line of defense at the reverse-proxy layer,
# in front of the app's own per-IP/day limits in api/index.js -- it protects
# against a raw flood hitting nginx/Node before Express even runs, across
# every /api/ path (including the Twilio inbound webhook), not just the one
# route the app-level limiter covers.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;
